<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no" />
  <meta name="description" content="剪纸拉力赛:程序生成的剪纸风环形赛道拉力赛,基于 three.js,3 圈对抗 3 位 AI 车手。" />
  <meta name="theme-color" content="#7bbf6a" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Ccircle cx='32' cy='32' r='30' fill='%23e03131' stroke='%23fffbe8' stroke-width='4'/%3E%3Ccircle cx='20' cy='40' r='7' fill='%2320232b'/%3E%3Ccircle cx='44' cy='40' r='7' fill='%2320232b'/%3E%3Crect x='14' y='24' width='36' height='14' rx='3' fill='%23fffbe8'/%3E%3C/svg%3E" />
  <title>剪纸拉力赛 · Paper Rally</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body { width: 100%; height: 100%; overflow: hidden; background: #7bbf6a; }
    body { font-family: "PingFang SC", "Microsoft YaHei", system-ui, sans-serif; user-select: none; }
    #game { position: fixed; inset: 0; }

    .hud {
      position: fixed; z-index: 5; color: #2c3b2a;
      text-shadow: 0 1px 0 rgba(255,255,255,0.7);
      pointer-events: none;
    }
    #topbar {
      top: 14px; left: 50%; transform: translateX(-50%);
      display: flex; gap: 20px; align-items: center;
      background: rgba(255, 252, 240, 0.88);
      border: 2px solid #d9c9a8; border-radius: 16px;
      padding: 8px 22px; font-size: 18px; font-weight: 700;
      box-shadow: 0 3px 0 rgba(60, 80, 40, 0.25);
    }
    #topbar .lap { color: #b8860b; }
    #topbar .pos { color: #c0392b; }

    #speedWrap {
      bottom: 26px; right: 26px;
      width: 150px; height: 150px;
      background: rgba(20, 24, 18, 0.55);
      border: 3px solid rgba(255,252,240,0.85);
      border-radius: 50%;
      display: flex; flex-direction: column; align-items: center; justify-content: center;
      color: #fffbe8;
    }
    #speedVal { font-size: 40px; font-weight: 800; line-height: 1; }
    #speedUnit { font-size: 13px; opacity: 0.8; margin-top: 4px; }

    #lapTimeWrap {
      top: 68px; left: 50%; transform: translateX(-50%);
      display: flex; gap: 14px; font-size: 14px;
      background: rgba(255, 252, 240, 0.78);
      border-radius: 10px; padding: 4px 14px;
    }

    #miniMapWrap {
      top: 14px; right: 20px;
      background: rgba(20, 24, 18, 0.5);
      border: 2px solid rgba(255,252,240,0.7);
      border-radius: 12px; padding: 6px;
    }
    #miniMap { display: block; }

    #toast {
      top: 108px; left: 50%; transform: translateX(-50%);
      font-size: 20px; font-weight: 800; color: #b03a2e;
      opacity: 0; transition: opacity 0.35s;
    }

    #countdown {
      top: 42%; left: 50%; transform: translate(-50%, -50%);
      font-size: 96px; font-weight: 900; color: #fffbe8;
      text-shadow: 0 4px 0 rgba(0,0,0,0.35);
      opacity: 0; transition: opacity 0.15s;
    }

    #tips {
      bottom: 16px; left: 26px;
      font-size: 13px; color: #24331f;
      background: rgba(255, 252, 240, 0.78);
      border-radius: 10px; padding: 6px 14px; line-height: 1.6;
    }

    #overlay {
      position: fixed; inset: 0; z-index: 10;
      display: flex; flex-direction: column; align-items: center; justify-content: center;
      background: rgba(20, 40, 20, 0.5); color: #fffbe8; text-align: center;
      backdrop-filter: blur(2px);
    }
    #overlay.hidden { display: none; }
    #overlay h1 { font-size: 44px; margin-bottom: 14px; text-shadow: 0 3px 0 rgba(0,0,0,0.3); }
    #overlay .sub { font-size: 18px; line-height: 1.9; }
    #overlay .blink { margin-top: 24px; font-size: 17px; animation: blink 1.1s infinite; }
    #overlay a.backlink {
      display: inline-block; margin-top: 22px; color: #fffbe8; opacity: 0.85;
      font-size: 14px; text-decoration: underline;
    }
    @keyframes blink { 50% { opacity: 0.25; } }
  </style>
</head>
<body>
  <div id="topbar" class="hud">
    <span>🏁 <span class="lap"><span id="lapNum">0</span>/<span id="lapTotal">3</span></span></span>
    <span>📍 <span class="pos"><span id="posNum">1</span>/<span id="posTotal">4</span></span></span>
    <span>⏱ <span id="raceTime">0:00.0</span></span>
  </div>
  <div id="lapTimeWrap" class="hud">
    <span>本圈 <span id="curLap">0:00.0</span></span>
    <span>最快 <span id="bestLap">--:--.-</span></span>
  </div>
  <div id="miniMapWrap" class="hud"><canvas id="miniMap" width="150" height="150"></canvas></div>
  <div id="speedWrap" class="hud">
    <div id="speedVal">0</div>
    <div id="speedUnit">km/h</div>
  </div>
  <div id="toast" class="hud"></div>
  <div id="countdown" class="hud">3</div>
  <div id="tips" class="hud">W/↑ 油门 · S/↓ 刹车/倒车 · A D/←→ 转向 · 空格 手刹漂移 · R 重新开始</div>
  <div id="overlay">
    <h1>🏎️ 剪纸拉力赛</h1>
    <div class="sub">
      纸境山谷环形赛道 · 3 圈对抗 3 位 AI 车手<br>
      漂移过弯,抢占内道,率先冲过终点旗!
    </div>
    <p class="blink">按任意键开始</p>
    <a class="backlink" href="./">← 返回北京跑酷</a>
  </div>
  <script type="module" src="/src/racing/main.js"></script>
</body>
</html>
