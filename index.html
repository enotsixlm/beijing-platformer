<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>楼梯即熔岩</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body { width: 100%; height: 100%; overflow: hidden; background: #0c0708; }
    body { font-family: "PingFang SC", "Microsoft YaHei", system-ui, sans-serif; user-select: none; color: #e8f4ff; }
    #game { position: fixed; inset: 0; cursor: crosshair; }

    .hud { position: fixed; z-index: 5; pointer-events: none; }
    #topbar {
      top: 14px; left: 50%; transform: translateX(-50%);
      display: flex; gap: 18px; align-items: center;
      background: rgba(8, 12, 16, 0.72);
      border: 1px solid rgba(122, 215, 255, 0.35);
      border-radius: 12px; padding: 8px 18px; font-size: 16px; font-weight: 700;
      letter-spacing: 0.04em;
    }
    #topbar .hot { color: #ff7a3a; }
    #toast {
      top: 58px; left: 50%; transform: translateX(-50%);
      font-size: 22px; font-weight: 800; color: #ffb48a;
      opacity: 0; transition: opacity 0.4s; text-shadow: 0 2px 12px #000;
    }
    #tips {
      bottom: 14px; left: 50%; transform: translateX(-50%);
      font-size: 13px; color: #9bb8c8;
      background: rgba(8, 12, 16, 0.65);
      border-radius: 10px; padding: 6px 14px;
    }
    #ranks {
      top: 14px; left: 14px;
      background: rgba(8, 12, 16, 0.7);
      border: 1px solid rgba(122, 215, 255, 0.25);
      border-radius: 10px; padding: 8px 12px; font-size: 13px; min-width: 132px;
    }
    #ranks .rk { display: flex; justify-content: space-between; gap: 12px; opacity: 0.85; }
    #ranks .rk.me { color: #7ad7ff; opacity: 1; font-weight: 700; }
    #thermo {
      top: 50%; right: 18px; transform: translateY(-50%);
      width: 14px; height: 220px;
      background: rgba(8, 12, 16, 0.7);
      border: 1px solid rgba(255, 122, 58, 0.4);
      border-radius: 8px; overflow: hidden; position: fixed;
    }
    #barLava {
      position: absolute; left: 0; right: 0; bottom: 0; height: 0%;
      background: linear-gradient(180deg, #ffb347, #ff3a00);
    }
    #barYou {
      position: absolute; left: -4px; width: 22px; height: 4px;
      background: #7ad7ff; bottom: 0; box-shadow: 0 0 8px #7ad7ff;
    }
    #countdown {
      position: fixed; inset: 0; z-index: 8; display: flex; align-items: center; justify-content: center;
      font-size: 120px; font-weight: 900; color: #ffb347;
      text-shadow: 0 0 24px #ff3a00; pointer-events: none;
    }
    #countdown.hidden, #overlay.hidden { display: none; }
    #overlay {
      position: fixed; inset: 0; z-index: 10;
      display: flex; flex-direction: column; align-items: center; justify-content: center;
      background: rgba(8, 6, 8, 0.72); text-align: center; backdrop-filter: blur(4px);
    }
    #overlay h1 { font-size: 44px; margin-bottom: 12px; color: #ff8a4a; text-shadow: 0 0 18px #ff3a00; }
    #overlay .sub { font-size: 17px; line-height: 1.85; color: #d5e6ef; }
    #overlay .blink { margin-top: 22px; font-size: 16px; animation: blink 1.1s infinite; color: #7ad7ff; }
    .btns { display: flex; gap: 10px; margin-top: 22px; pointer-events: auto; }
    .btns button {
      background: #141a20; color: #e8f4ff; border: 1px solid #7ad7ff;
      border-radius: 10px; padding: 10px 16px; font-size: 15px; font-weight: 700; cursor: pointer;
    }
    .btns button:hover { background: #1e2a36; }
    @keyframes blink { 50% { opacity: 0.25; } }
  </style>
</head>
<body>
  <div id="topbar" class="hud">
    <span>⏱ <span id="time">0:00.0</span></span>
    <span>楼层 <span id="floor">1F</span></span>
    <span class="hot">熔岩 <span id="lavaH">—</span></span>
  </div>
  <div id="ranks" class="hud"></div>
  <div id="thermo" class="hud"><div id="barLava"></div><div id="barYou"></div></div>
  <div id="toast" class="hud"></div>
  <div id="tips" class="hud">WASD 移动 · 空格 跳（二段跳）· 鼠标转视角 · 点画面锁定鼠标 · R 重开</div>
  <div id="countdown" class="hidden">5</div>
  <div id="overlay">
    <h1>楼梯即熔岩</h1>
    <div class="sub">
      整栋楼只有这一间楼梯井。5 秒后一楼大厅变成熔岩，<br>
      熔岩沿井筒往上涌。踩踏步、休息平台、断裂边缘，推开纸箱往上逃。<br>
      先到天台安全门的人获胜。
    </div>
    <div id="btns" class="btns">
      <button data-n="1">1 人逃出</button>
      <button data-n="4">4 人混战</button>
      <button data-n="8">8 人逃命</button>
    </div>
  </div>
  <script type="module" src="/src/main.js"></script>
</body>
</html>
