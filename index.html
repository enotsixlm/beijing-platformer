<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>VX Range</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body { width: 100%; height: 100%; overflow: hidden; background: #05080c; }
    body {
      font-family: "Segoe UI", "PingFang SC", system-ui, sans-serif;
      user-select: none; color: #e8f4ff;
    }
    #game { position: fixed; inset: 0; display: block; }

    .hud { position: fixed; z-index: 5; pointer-events: none; }

    #fps {
      top: 10px; left: 12px;
      font-size: 12px; letter-spacing: 0.08em; color: #9ad7e8; opacity: 0.85;
    }

    #vitals {
      top: 30px; left: 12px;
      width: 220px; padding: 8px 10px 10px;
      background: rgba(6, 10, 16, 0.72);
      border: 1px solid rgba(90, 200, 230, 0.18);
      border-radius: 8px;
    }
    #vitals .label {
      font-size: 11px; letter-spacing: 0.18em; color: #c9d6e0; margin-bottom: 5px;
    }
    #vitals .row { display: flex; align-items: center; gap: 8px; }
    #hpTrack {
      flex: 1; height: 10px; background: #1a1510; border-radius: 3px; overflow: hidden;
    }
    #hpFill {
      height: 100%; width: 100%;
      background: linear-gradient(90deg, #ff7a18, #ffd24a);
    }
    #hpText { font-size: 12px; color: #fff; min-width: 58px; text-align: right; }

    #titlebar {
      top: 8px; left: 50%; transform: translateX(-50%);
      font-size: 13px; letter-spacing: 0.12em; color: #d5e6f0; opacity: 0.8;
    }

    #weaponInfo {
      top: 12px; right: 14px;
      min-width: 180px; padding: 8px 12px;
      background: rgba(6, 10, 16, 0.72);
      border: 1px solid rgba(90, 200, 230, 0.18);
      border-radius: 8px; text-align: right;
    }
    #weaponName {
      font-size: 13px; letter-spacing: 0.14em; color: #f2f7fb;
    }
    #ammo {
      margin-top: 2px; font-size: 18px; font-weight: 700; color: #fff;
    }
    #ammo.low { color: #ffb04a; }

    #hotbar {
      bottom: 18px; left: 50%; transform: translateX(-50%);
      display: flex; gap: 8px;
    }
    .slot {
      width: 64px; height: 64px;
      background: rgba(8, 12, 18, 0.78);
      border: 2px solid rgba(160, 180, 196, 0.28);
      border-radius: 10px; position: relative;
      display: flex; align-items: center; justify-content: center;
    }
    .slot.active { border-color: #ff8a2a; box-shadow: 0 0 0 1px rgba(255, 138, 42, 0.35); }
    .slot canvas { width: 46px; height: 46px; }
    .slot .num {
      position: absolute; left: 5px; bottom: 3px;
      font-size: 10px; color: #c5d0da;
    }

    #crosshair {
      top: 50%; left: 50%; transform: translate(-50%, -50%);
      width: 22px; height: 22px;
    }
    #crosshair .dot {
      position: absolute; left: 50%; top: 50%; width: 3px; height: 3px;
      margin: -1.5px 0 0 -1.5px; background: #fff; border-radius: 50%;
      box-shadow: 0 0 4px #fff;
    }
    #crosshair .tick {
      position: absolute; background: rgba(255,255,255,0.9);
    }
    #crosshair.cannon .tick.t { left: 9px; top: 2px; width: 3px; height: 5px; }
    #crosshair.cannon .tick.b { left: 9px; bottom: 2px; width: 3px; height: 5px; }
    #crosshair.cannon .tick.l { top: 9px; left: 2px; width: 5px; height: 3px; }
    #crosshair.cannon .tick.r { top: 9px; right: 2px; width: 5px; height: 3px; }
    #crosshair.auto .tick.t { left: 10px; top: 0; width: 2px; height: 6px; }
    #crosshair.auto .tick.b { left: 10px; bottom: 0; width: 2px; height: 6px; }
    #crosshair.auto .tick.l { top: 10px; left: 0; width: 6px; height: 2px; }
    #crosshair.auto .tick.r { top: 10px; right: 0; width: 6px; height: 2px; }
    #crosshair.spread { width: 34px; height: 34px; }
    #crosshair.spread .tick.t { left: 15px; top: 2px; width: 3px; height: 6px; }
    #crosshair.spread .tick.b { left: 15px; bottom: 2px; width: 3px; height: 6px; }
    #crosshair.spread .tick.l { top: 15px; left: 2px; width: 6px; height: 3px; }
    #crosshair.spread .tick.r { top: 15px; right: 2px; width: 6px; height: 3px; }
    #crosshair.rocket { width: 28px; height: 28px; }
    #crosshair.rocket .tick.t { left: 12px; top: 0; width: 4px; height: 7px; }
    #crosshair.rocket .tick.b { left: 12px; bottom: 0; width: 4px; height: 7px; }
    #crosshair.rocket .tick.l { top: 12px; left: 0; width: 7px; height: 4px; }
    #crosshair.rocket .tick.r { top: 12px; right: 0; width: 7px; height: 4px; }

    #reloadWrap {
      top: 50%; left: 50%; transform: translate(-50%, 28px);
      display: none; text-align: center;
    }
    #reloadWrap.show { display: block; }
    #reloadRing { width: 36px; height: 36px; }
    #reloadText {
      margin-top: 4px; font-size: 11px; letter-spacing: 0.2em; color: #ffe08a;
    }

    #overlay {
      position: fixed; inset: 0; z-index: 10;
      display: flex; flex-direction: column; align-items: center; justify-content: center;
      background: rgba(4, 8, 14, 0.55); text-align: center;
      backdrop-filter: blur(2px);
    }
    #overlay.hidden { display: none; }
    #overlay h1 {
      font-size: 42px; letter-spacing: 0.18em; font-weight: 700;
      text-shadow: 0 0 24px rgba(46, 232, 255, 0.35);
    }
    #overlay .sub { margin-top: 14px; font-size: 15px; line-height: 1.8; color: #c5d7e4; }
    #overlay .blink { margin-top: 28px; letter-spacing: 0.16em; animation: blink 1.2s infinite; }
    @keyframes blink { 50% { opacity: 0.25; } }

    #dmgLayer { position: fixed; inset: 0; z-index: 4; pointer-events: none; overflow: hidden; }
    .dmg {
      position: absolute; color: #fff; font-weight: 800; font-size: 18px;
      text-shadow: 0 0 8px #fff, 0 1px 0 #000;
      animation: floatDmg 0.55s ease-out forwards;
    }
    @keyframes floatDmg {
      from { opacity: 1; transform: translate(-50%, 0); }
      to { opacity: 0; transform: translate(-50%, -36px); }
    }
  </style>
</head>
<body>
  <div id="fps" class="hud">60 FPS</div>
  <div id="vitals" class="hud">
    <div class="label">VITALS</div>
    <div class="row">
      <div id="hpTrack"><div id="hpFill"></div></div>
      <div id="hpText">100/100</div>
    </div>
  </div>
  <div id="titlebar" class="hud">VX Range · Play Mode</div>
  <div id="weaponInfo" class="hud">
    <div id="weaponName">VX-9 HAND CANNON</div>
    <div id="ammo">10 / 10</div>
  </div>
  <div id="hotbar" class="hud">
    <div class="slot active" data-slot="0"><canvas width="46" height="46"></canvas><span class="num">1</span></div>
    <div class="slot" data-slot="1"><canvas width="46" height="46"></canvas><span class="num">2</span></div>
    <div class="slot" data-slot="2"><canvas width="46" height="46"></canvas><span class="num">3</span></div>
    <div class="slot" data-slot="3"><canvas width="46" height="46"></canvas><span class="num">4</span></div>
  </div>
  <div id="crosshair" class="hud cannon">
    <div class="dot"></div>
    <div class="tick t"></div><div class="tick b"></div>
    <div class="tick l"></div><div class="tick r"></div>
  </div>
  <div id="reloadWrap" class="hud">
    <svg id="reloadRing" viewBox="0 0 36 36">
      <circle cx="18" cy="18" r="14" fill="none" stroke="rgba(255,255,255,0.15)" stroke-width="3"/>
      <circle id="reloadArc" cx="18" cy="18" r="14" fill="none" stroke="#ffd24a" stroke-width="3"
        stroke-linecap="round" stroke-dasharray="88" stroke-dashoffset="88" transform="rotate(-90 18 18)"/>
    </svg>
    <div id="reloadText">RELOADING</div>
  </div>
  <div id="dmgLayer"></div>
  <div id="overlay">
    <h1>VX RANGE</h1>
    <div class="sub">
      Third-person voxel range · four guns · shatter dummies · carve terrain<br>
      WASD move · SHIFT dash · SPACE jump · Mouse aim · LMB fire · 1-4 weapons · R reload
    </div>
    <p class="blink">CLICK TO PLAY</p>
  </div>
  <script type="module" src="/src/main.js"></script>
</body>
</html>
