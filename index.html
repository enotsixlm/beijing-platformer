<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Voxline</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body { width: 100%; height: 100%; overflow: hidden; background: #071018; }
    body {
      font-family: "Segoe UI", "PingFang SC", system-ui, sans-serif;
      user-select: none; color: #e8f4ff;
    }
    #game { position: fixed; inset: 0; display: block; }

    #vignette {
      position: fixed; inset: 0; z-index: 3; pointer-events: none;
      background: radial-gradient(ellipse at center, transparent 58%, rgba(0, 6, 12, 0.38) 100%);
    }

    .hud { position: fixed; z-index: 5; pointer-events: none; }

    #chrome {
      top: 0; left: 0; right: 0; height: 28px;
      display: flex; align-items: center; justify-content: space-between;
      padding: 0 10px;
      background: rgba(8, 12, 16, 0.72);
      border-bottom: 1px solid rgba(255,255,255,0.06);
      font-size: 12px; letter-spacing: 0.04em; color: #d5e0ea;
    }
    #chrome .icons { display: flex; gap: 8px; opacity: 0.55; }
    #chrome .icons span {
      width: 14px; height: 14px; border: 1px solid rgba(230,240,255,0.45); border-radius: 3px;
    }

    #fps {
      top: 36px; left: 12px;
      font-size: 11px; letter-spacing: 0.08em; color: #b7c9d4; opacity: 0.9;
    }

    #vitals {
      top: 52px; left: 12px;
      width: 198px; padding: 7px 9px 8px;
      background: rgba(8, 12, 18, 0.78);
      border-radius: 8px;
    }
    #vitals .label {
      font-size: 10px; letter-spacing: 0.2em; color: #c9d6e0; margin-bottom: 4px;
    }
    #vitals .row { display: flex; align-items: center; gap: 8px; }
    #hpTrack {
      flex: 1; height: 8px; background: #1a1510; border-radius: 2px; overflow: hidden;
    }
    #hpFill {
      height: 100%; width: 100%;
      background: linear-gradient(90deg, #ff8a2a, #ffe08a);
    }
    #hpText { font-size: 11px; color: #fff; min-width: 52px; text-align: right; }

    #pauseChip {
      top: 36px; right: 14px;
      width: 26px; height: 26px; border-radius: 50%;
      border: 1.5px solid rgba(220, 230, 240, 0.55);
      display: flex; align-items: center; justify-content: center; gap: 3px;
    }
    #pauseChip i {
      display: block; width: 3px; height: 10px; background: #e8f4ff; opacity: 0.9;
    }

    #weaponInfo {
      top: 68px; right: 14px;
      min-width: 168px; padding: 6px 10px 8px;
      background: rgba(8, 12, 18, 0.78);
      border-radius: 8px;
      display: flex; align-items: center; gap: 8px; justify-content: flex-end;
    }
    #weaponIcon { width: 36px; height: 36px; flex: 0 0 auto; }
    #weaponCopy { text-align: right; }
    #weaponName {
      font-size: 11px; letter-spacing: 0.08em; color: #eef3f7; white-space: nowrap;
    }
    #ammo {
      margin-top: 1px; font-size: 16px; font-weight: 700; color: #fff;
    }
    #ammo.low { color: #ffb04a; }

    #hotbar {
      bottom: 18px; left: 50%; transform: translateX(-50%);
      display: flex; gap: 8px;
    }
    .slot {
      width: 64px; height: 64px;
      background: rgba(6, 10, 16, 0.86);
      border: 2px solid rgba(160, 180, 196, 0.22);
      border-radius: 10px; position: relative;
      display: flex; align-items: center; justify-content: center;
    }
    .slot.active {
      border-color: #ff8a2a;
      box-shadow: 0 0 0 1px rgba(255, 138, 42, 0.45), 0 0 16px rgba(255, 120, 30, 0.28);
    }
    .slot canvas { width: 46px; height: 46px; }
    .slot .num {
      position: absolute; left: 5px; bottom: 3px;
      font-size: 10px; color: #c5d0da;
    }

    #crosshair {
      top: 50%; left: 50%; transform: translate(-50%, -50%);
      width: 8px; height: 8px;
    }
    #crosshair .dot {
      position: absolute; left: 50%; top: 50%; width: 4px; height: 4px;
      margin: -2px 0 0 -2px; background: #fff; border-radius: 50%;
      box-shadow: 0 0 6px #fff;
    }

    #reloadWrap {
      top: 50%; left: 50%; transform: translate(-50%, 28px);
      display: none; text-align: center;
    }
    #reloadWrap.show { display: block; }
    #reloadRing { width: 36px; height: 36px; }
    #reloadText {
      margin-top: 4px; font-size: 11px; letter-spacing: 0.2em; color: #ffe08a;
    }

    #overlay {
      position: fixed; inset: 0; z-index: 10;
      display: flex; flex-direction: column; align-items: center; justify-content: center;
      background: rgba(4, 8, 14, 0.55); text-align: center;
      backdrop-filter: blur(2px);
    }
    #overlay.hidden { display: none; }
    #overlay h1 {
      font-size: 42px; letter-spacing: 0.18em; font-weight: 700;
      text-shadow: 0 0 24px rgba(46, 232, 255, 0.35);
    }
    #overlay .sub { margin-top: 14px; font-size: 15px; line-height: 1.8; color: #c5d7e4; }
    #overlay .blink { margin-top: 28px; letter-spacing: 0.16em; animation: blink 1.2s infinite; }
    @keyframes blink { 50% { opacity: 0.25; } }

    #dmgLayer { position: fixed; inset: 0; z-index: 4; pointer-events: none; overflow: hidden; }
    .dmg {
      position: absolute; color: #fff; font-weight: 800; font-size: 18px;
      text-shadow: 0 0 8px #fff, 0 1px 0 #000;
      animation: floatDmg 0.55s ease-out forwards;
    }
    @keyframes floatDmg {
      from { opacity: 1; transform: translate(-50%, 0); }
      to { opacity: 0; transform: translate(-50%, -36px); }
    }
  </style>
</head>
<body>
  <div id="vignette"></div>
  <div id="chrome" class="hud">
    <div>Voxline - Play Mode</div>
    <div class="icons"><span></span><span></span><span></span></div>
  </div>
  <div id="fps" class="hud">60 FPS</div>
  <div id="vitals" class="hud">
    <div class="label">VITALS</div>
    <div class="row">
      <div id="hpTrack"><div id="hpFill"></div></div>
      <div id="hpText">100/100</div>
    </div>
  </div>
  <div id="pauseChip" class="hud"><i></i><i></i></div>
  <div id="weaponInfo" class="hud">
    <canvas id="weaponIcon" width="36" height="36"></canvas>
    <div id="weaponCopy">
      <div id="weaponName">VX-9 HAND CA...</div>
      <div id="ammo">10 / 10</div>
    </div>
  </div>
  <div id="hotbar" class="hud">
    <div class="slot active" data-slot="0"><canvas width="46" height="46"></canvas><span class="num">1</span></div>
    <div class="slot" data-slot="1"><canvas width="46" height="46"></canvas><span class="num">2</span></div>
    <div class="slot" data-slot="2"><canvas width="46" height="46"></canvas><span class="num">3</span></div>
    <div class="slot" data-slot="3"><canvas width="46" height="46"></canvas><span class="num">4</span></div>
  </div>
  <div id="crosshair" class="hud">
    <div class="dot"></div>
  </div>
  <div id="reloadWrap" class="hud">
    <svg id="reloadRing" viewBox="0 0 36 36">
      <circle cx="18" cy="18" r="14" fill="none" stroke="rgba(255,255,255,0.15)" stroke-width="3"/>
      <circle id="reloadArc" cx="18" cy="18" r="14" fill="none" stroke="#ffd24a" stroke-width="3"
        stroke-linecap="round" stroke-dasharray="88" stroke-dashoffset="88" transform="rotate(-90 18 18)"/>
    </svg>
    <div id="reloadText">RELOADING</div>
  </div>
  <div id="dmgLayer"></div>
  <div id="overlay">
    <h1>VOXLINE</h1>
    <div class="sub">
      Third-person voxel range · four guns · shatter dummies · carve terrain<br>
      WASD move · SHIFT dash · SPACE jump · Mouse aim · LMB fire · 1-4 weapons · R reload
    </div>
    <p class="blink">CLICK TO PLAY</p>
  </div>
  <script type="module" src="/src/main.js"></script>
</body>
</html>
