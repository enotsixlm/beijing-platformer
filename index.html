<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <link rel="icon" href="data:," />
  <title>北京跑酷 · 熊猫跳跳</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body { width: 100%; height: 100%; overflow: hidden; background: #b5d9ec; }
    body { font-family: "PingFang SC", "Microsoft YaHei", system-ui, sans-serif; user-select: none; }
    #game { position: fixed; inset: 0; }

    .hud {
      position: fixed; z-index: 5; color: #4a3c2a;
      text-shadow: 0 1px 0 rgba(255,255,255,0.8);
      pointer-events: none;
    }
    #topbar {
      top: 14px; left: 50%; transform: translateX(-50%);
      display: flex; gap: 18px; align-items: center;
      background: rgba(255, 252, 240, 0.88);
      border: 2px solid #d9c9a8; border-radius: 16px;
      padding: 8px 20px; font-size: 18px; font-weight: 700;
      box-shadow: 0 3px 0 rgba(120, 96, 60, 0.25);
    }
    #topbar .coin { color: #b8860b; }
    #progressWrap {
      top: 62px; left: 50%; transform: translateX(-50%);
      width: 340px; height: 12px; border-radius: 8px;
      background: rgba(255, 252, 240, 0.85);
      border: 2px solid #d9c9a8; overflow: hidden;
    }
    #progressBar {
      height: 100%; width: 0%;
      background: linear-gradient(90deg, #e03131, #ffb300);
      border-radius: 6px; transition: width 0.25s;
    }
    #checkpointToast {
      top: 96px; left: 50%; transform: translateX(-50%);
      font-size: 22px; font-weight: 800; color: #b03a2e;
      opacity: 0; transition: opacity 0.4s;
    }
    #tips {
      bottom: 14px; left: 50%; transform: translateX(-50%);
      font-size: 13px; color: #6d5c42;
      background: rgba(255, 252, 240, 0.75);
      border-radius: 10px; padding: 5px 14px;
    }
    #overlay {
      position: fixed; inset: 0; z-index: 10;
      display: flex; flex-direction: column; align-items: center; justify-content: center;
      background: rgba(30, 40, 60, 0.45); color: #fffbe8; text-align: center;
      backdrop-filter: blur(2px);
    }
    #overlay.hidden { display: none; }
    #overlay h1 { font-size: 46px; margin-bottom: 14px; text-shadow: 0 3px 0 rgba(0,0,0,0.3); }
    #overlay .sub { font-size: 19px; line-height: 1.9; }
    #overlay .blink { margin-top: 26px; font-size: 17px; animation: blink 1.1s infinite; }
    @keyframes blink { 50% { opacity: 0.25; } }
  </style>
</head>
<body>
  <div id="topbar" class="hud">
    <span>🪙 <span id="coins">0</span>/<span id="coinsTotal">0</span></span>
    <span>⏱ <span id="time">0:00.0</span></span>
    <span>🚩 <span id="cpName">天安门广场</span></span>
  </div>
  <div id="progressWrap" class="hud"><div id="progressBar"></div></div>
  <div id="checkpointToast" class="hud"></div>
  <div id="tips" class="hud">WASD/方向键 移动 · 空格 跳(可二段跳) · Q/E 转视角 · R 回检查点</div>
  <div id="overlay">
    <h1>🐼 北京跑酷</h1>
    <div class="sub">
      从天安门出发，翻过胡同屋脊、灯笼桥、天坛与 CBD 楼顶，<br>
      一路向北跳进鸟巢！小心别掉到马路上。
    </div>
    <p class="blink">按任意键开始</p>
  </div>
  <script type="module" src="/src/main.js"></script>
</body>
</html>
