<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>Turbo Kart Legends</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
