<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no" />
  <title>SHIBA DASH!! お散歩グランプリ</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body { width: 100%; height: 100%; overflow: hidden; background: #7ec8e3; }
    body {
      font-family: "Trebuchet MS", "Hiragino Sans", "PingFang SC", "Noto Sans JP", "Microsoft YaHei", sans-serif;
      user-select: none; color: #3a2a1c;
    }
    #game { position: fixed; inset: 0; }

    .panel {
      position: fixed; z-index: 8;
      background: rgba(255, 248, 236, 0.92);
      border: 3px solid #e07a3a;
      border-radius: 18px;
      box-shadow: 0 6px 0 rgba(120, 60, 20, 0.25);
    }
    .hidden { display: none !important; }

    #menu {
      inset: 0; z-index: 10;
      display: flex; flex-direction: column; align-items: flex-start; justify-content: center;
      padding: 28px 36px; pointer-events: none;
      background: linear-gradient(90deg, rgba(255,246,232,0.92) 0%, rgba(255,246,232,0.55) 42%, rgba(255,246,232,0) 70%);
    }
    #menu > * { pointer-events: auto; }
    #menu h1 {
      font-size: clamp(36px, 6vw, 58px); letter-spacing: 1px;
      color: #e07a3a; text-shadow: 3px 3px 0 #fff3d6, 0 4px 0 rgba(180,80,20,0.25);
    }
    #menu .sub { font-size: 20px; color: #8a5a32; margin: 2px 0 16px; }
    .row { display: flex; flex-wrap: wrap; gap: 8px; margin: 8px 0 4px; }
    .lbl { font-size: 13px; font-weight: 700; color: #8a5a32; margin-top: 8px; }
    button {
      font: inherit; cursor: pointer; border: 2px solid #c45f28; border-radius: 12px;
      background: #fff8ee; color: #3a2a1c; padding: 8px 14px; font-weight: 700;
    }
    button:hover { background: #ffe2c4; }
    button.sel { background: #e07a3a; color: #fff8ee; border-color: #8a3a12; }
    #btnStart {
      margin-top: 16px; font-size: 22px; padding: 12px 28px;
      background: #e07a3a; color: #fff; border-color: #8a3a12;
      box-shadow: 0 4px 0 #8a3a12;
    }
    #dogStat, #courseStat { font-size: 13px; color: #6a4a32; max-width: 520px; line-height: 1.5; }
    .credit { margin-top: 18px; font-size: 12px; color: #8a6a50; }

    #hud { position: fixed; inset: 0; z-index: 6; pointer-events: none; }
    #topL, #topR, #topC {
      position: absolute; top: 12px;
      background: rgba(30, 20, 14, 0.55); color: #fff8ee;
      border-radius: 14px; padding: 8px 14px; font-weight: 800;
      text-shadow: 0 1px 0 #000;
    }
    #topL { left: 12px; }
    #topR { right: 12px; text-align: right; }
    #topC { left: 50%; transform: translateX(-50%); font-size: 22px; }
    #topL .big { font-size: 28px; color: #ffe08a; }
    .dash { display: inline-block; width: 18px; height: 18px; border-radius: 4px; background: #5a4a3a; margin-left: 4px; vertical-align: middle; }
    .dash.on { background: #3ee0e8; box-shadow: 0 0 8px #3ee0e8; }
    #minimap { position: absolute; left: 12px; bottom: 88px; width: 160px; height: 160px; border-radius: 14px; }
    #tips { position: absolute; bottom: 14px; left: 50%; transform: translateX(-50%); font-size: 12px; color: #3a2a1c;
      background: rgba(255,248,236,0.75); padding: 4px 12px; border-radius: 10px; }

    #touch {
      position: fixed; z-index: 7; left: 0; right: 0; bottom: 10px;
      display: flex; justify-content: space-between; padding: 0 18px; pointer-events: none;
    }
    #touch button {
      pointer-events: auto; width: 76px; height: 76px; border-radius: 50%;
      font-size: 28px; background: rgba(255,248,236,0.82); border: 3px solid #e07a3a;
    }
    #btnDash { width: 90px !important; height: 90px !important; font-size: 14px !important; background: rgba(62,224,232,0.85) !important; }

    #count {
      position: fixed; inset: 0; z-index: 9; display: flex; align-items: center; justify-content: center;
      font-size: 96px; font-weight: 900; color: #fff; text-shadow: 0 6px 0 rgba(0,0,0,0.3); pointer-events: none;
    }
    #pause, #finish {
      position: fixed; inset: 0; z-index: 11;
      display: flex; flex-direction: column; align-items: center; justify-content: center;
      background: rgba(20, 14, 10, 0.45); color: #fffbe8; text-align: center; gap: 12px;
    }
    #pause h2, #finish h2 { font-size: 42px; }
    #btnPause {
      position: fixed; z-index: 8; top: 14px; right: 170px; pointer-events: auto;
      width: 44px; height: 44px; border-radius: 12px;
    }

    @media (min-width: 900px) {
      #touch { display: none; }
    }
  </style>
</head>
<body>
  <div id="menu">
    <h1>SHIBA DASH!!</h1>
    <div class="sub">お散歩グランプリ　·　柴犬拖着饲主狂奔</div>
    <div class="lbl">犬種</div>
    <div class="row" id="dogs">
      <button data-dog="aka">赤柴</button>
      <button data-dog="kuro">黒柴</button>
      <button data-dog="shiro">白柴</button>
      <button data-dog="goma">胡麻柴</button>
    </div>
    <div id="dogStat"></div>
    <div class="lbl">コース</div>
    <div class="row" id="courses">
      <button data-course="0">ひる</button>
      <button data-course="1">ゆうやけ</button>
      <button data-course="2">あめ</button>
      <button data-course="3">COOL</button>
      <button data-course="4">くだり</button>
      <button data-course="5">2049</button>
    </div>
    <div id="courseStat"></div>
    <div class="lbl">むずかしさ</div>
    <div class="row" id="diffs">
      <button data-diff="easy">幼柴</button>
      <button data-diff="normal">若柴</button>
      <button data-diff="hard">厳柴</button>
    </div>
    <button id="btnStart">スタート</button>
    <div class="credit">
      ←→ / A D 转向　空格 Coin Dash　P 暂停<br>
      犬会自己跑；金币只有被拖着的饲主捡得到。<br>
      灵感来自 AMIX「SHIBA DASH!!」· 本作为程序生成美术的致敬复刻
    </div>
  </div>

  <div id="hud" class="hidden">
    <div id="topL">
      <div><span class="big" id="place">1</span> 位</div>
      <div>LAP <span id="lap">1/3</span></div>
      <div id="courseName">ひるのまち</div>
    </div>
    <div id="topC"><span id="speed">0</span> km/h</div>
    <div id="topR">
      <div>⏱ <span id="time">0:00.0</span></div>
      <div>BEST <span id="best">--:--.-</span></div>
      <div>🪙 <span id="coins">0</span>
        <span id="dashA" class="dash"></span>
        <span id="dashB" class="dash"></span>
      </div>
    </div>
    <canvas id="minimap" width="160" height="160"></canvas>
    <div id="tips">水色面板加速 · 饲主碰到球鞋会急停 · 叼木棒能挡住后方的柴</div>
  </div>
  <button id="btnPause" class="hidden" style="display:none">❚❚</button>

  <div id="touch" class="hidden">
    <button id="btnL">◀</button>
    <button id="btnDash">DASH</button>
    <button id="btnR">▶</button>
  </div>

  <div id="count" class="hidden">3</div>
  <div id="pause" class="hidden">
    <h2>ポーズ</h2>
    <div>
      <button id="btnResume">再開</button>
      <button id="btnQuit">メニュー</button>
    </div>
  </div>
  <div id="finish" class="hidden">
    <h2 id="finishTitle">ゴール！</h2>
    <div id="finishStats"></div>
    <div>
      <button id="btnAgain">もういちど</button>
      <button id="btnMenu">メニュー</button>
    </div>
  </div>

  <script type="module" src="./src/main.js"></script>
</body>
</html>
